name: Publish to PyPI

# Publishes on a GitHub Release. Uses PyPI Trusted Publishing (OIDC), so no
# API token exists anywhere, not in secrets, not on a laptop.
#
# One-time setup on PyPI: project Settings -> Publishing -> Add a new publisher
#   Owner:            reliax-io
#   Repository:       reliax-core
#   Workflow name:    publish.yml
#   Environment:      pypi
#
# For the very first upload the project does not exist yet, so configure a
# "pending publisher" at https://pypi.org/manage/account/publishing/ instead.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test before building
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reliax-core
    permissions:
      id-token: write        # required for Trusted Publishing
      attestations: write    # signs the artifacts
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: "dist/*"

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
